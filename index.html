<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131921">
<title>متجر — الخيزران</title>
<style>
:root {
  --amz-nav: #131921;
  --amz-subnav: #232f3e;
  --amz-orange: #febd69;
  --amz-orange-dark: #f3a847;
  --amz-yellow: #ffd814;
  --amz-yellow-hover: #f7ca00;
  --bg: #eaeded;
  --card: #ffffff;
  --tabs: #f0f2f2;
  --text: #0f1111;
  --muted: #565959;
  --primary: #007185;
  --success: #007600;
  --border: #d5d9d9;
  --danger: #b12704;
  --price-color: #0f1111;
}
[data-theme="dark"] {
  --bg: #0b132b;
  --card: #14213d;
  --tabs: #1c2b4a;
  --text: #eef2ff;
  --muted: #9aa8c7;
  --primary: #4ea8de;
  --success: #34d399;
  --border: #26375c;
  --danger: #f87171;
  --price-color: #34d399;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
body { padding: env(safe-area-inset-top, 0) 0 calc(85px + env(safe-area-inset-bottom, 0)); }

/* Amazon Header */
.amz-header { position: sticky; top: 0; z-index: 15; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.nav-top { background: var(--amz-nav); color: #fff; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand-area { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
.menu-btn { background: transparent; border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 18px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 700; }
.menu-btn span { font-size: 13px; }
.shop-titles h1 { margin: 0; font-size: 18px; font-weight: 800; color: #fff; line-height: 1.2; }
.shop-titles p { margin: 2px 0 0; font-size: 11px; color: #ccc; display: flex; align-items: center; gap: 4px; }

.header-actions { display: flex; align-items: center; gap: 8px; }
.theme-toggle { background: var(--amz-subnav); border: 1px solid rgba(255,255,255,.2); color: #fff; border-radius: 8px; width: 38px; height: 38px; font-size: 16px; cursor: pointer; display: grid; place-items: center; }
.top-cart-btn { background: transparent; border: 1px solid rgba(255,255,255,.2); color: #fff; border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 800; font-size: 14px; position: relative; }
.top-cart-badge { background: #f08804; color: #111; font-weight: 900; padding: 1px 6px; border-radius: 10px; font-size: 12px; }

/* Amazon Search Bar */
.search-row { width: 100%; order: 3; margin-top: 4px; }
.amz-search-box { display: flex; width: 100%; height: 42px; border-radius: 8px; overflow: hidden; background: #fff; border: 2px solid transparent; transition: border-color .15s; }
.amz-search-box:focus-within { border-color: #f90; }
.search-cat-select { background: #e6e6e6; color: #333; border: 0; border-left: 1px solid #cdcdcd; padding: 0 10px; font-size: 12px; font-family: inherit; max-width: 115px; cursor: pointer; outline: none; }
.amz-search-input { flex: 1; border: 0; padding: 0 12px; font-size: 15px; color: #111; font-family: inherit; outline: none; min-width: 0; }
.amz-search-btn { background: var(--amz-orange); border: 0; width: 46px; display: grid; place-items: center; font-size: 18px; cursor: pointer; color: #111; }
.amz-search-btn:hover { background: var(--amz-orange-dark); }

/* Sub Navigation Bar (Categories) */
.nav-sub { background: var(--amz-subnav); padding: 8px 12px; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.nav-sub::-webkit-scrollbar { display: none; }
.all-cats-pill { flex: 0 0 auto; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 5px 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.cats { display: flex; gap: 6px; }
.cats button { flex: 0 0 auto; border: 1px solid transparent; background: transparent; color: #fff; border-radius: 6px; padding: 5px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: .15s; }
.cats button:hover { border-color: rgba(255,255,255,.6); }
.cats button[aria-pressed="true"] { background: var(--amz-orange); color: #111; font-weight: 800; border-color: var(--amz-orange); }

/* Toolbar: Results count, Sort, View toggle */
.wrap { max-width: 1140px; margin: 0 auto; padding: 0 12px; }
.toolbar { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin: 12px 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; }
.results-info { color: var(--muted); font-weight: 600; }
.results-info b { color: var(--text); }
.controls-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-chip { display: flex; align-items: center; gap: 5px; background: var(--tabs); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; user-select: none; }
.filter-chip input { margin: 0; accent-color: var(--primary); }
.sort-select { background: var(--tabs); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 12px; font-family: inherit; outline: none; }
.view-btn { background: var(--tabs); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; font-size: 14px; cursor: pointer; }
.view-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Grid & List Layouts */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
.grid.list-view { grid-template-columns: 1fr; }
.item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; position: relative; }
.item:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.grid.list-view .item { flex-direction: row; align-items: stretch; }

.ph { aspect-ratio: 1/1; background: var(--tabs); display: grid; place-items: center; font-size: 38px; color: var(--muted); cursor: pointer; position: relative; overflow: hidden; }
.grid.list-view .ph { width: 130px; flex-shrink: 0; aspect-ratio: auto; }
.ph img { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; padding: 6px; }
.cat-badge { position: absolute; top: 6px; right: 6px; background: rgba(19,25,33,.78); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 4px; backdrop-filter: blur(2px); }

.info { padding: 10px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.item-title { font-size: 14px; line-height: 1.4; font-weight: 700; color: var(--text); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item-title:hover { color: var(--primary); }
.info small { color: var(--muted); font-size: 12px; }
.price-box { margin-top: 2px; }
.price { font-weight: 900; color: var(--price-color); font-size: 17px; }
.stock-ok { color: var(--success); font-size: 11px; font-weight: 700; }
.out { color: var(--danger); font-size: 12px; font-weight: 700; }

/* Amazon Yellow Add Button */
.add { margin-top: auto; border: 1px solid #FCD200; border-radius: 20px; padding: 8px 10px; background: var(--amz-yellow); color: #0F1111; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 2px 5px rgba(213,217,217,.5); transition: background .15s; }
.add:hover:not([disabled]) { background: var(--amz-yellow-hover); }
.add[disabled] { opacity: .45; cursor: not-allowed; background: var(--tabs); color: var(--muted); border-color: var(--border); box-shadow: none; }

.qty { margin-top: auto; display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; gap: 4px; background: var(--tabs); border-radius: 20px; padding: 2px; border: 1px solid var(--border); }
.qty button { border: 0; background: var(--card); color: var(--text); border-radius: 50%; width: 32px; height: 32px; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.qty span { text-align: center; font-weight: 900; font-size: 14px; }

/* Side Drawer (Amazon All Menu) */
.drawer-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: none; }
.drawer-backdrop.on { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(85vw, 320px); z-index: 31; background: var(--card); transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; overflow: hidden; }
.drawer-backdrop.on .drawer { transform: translateX(0); }
.drawer-head { background: var(--amz-subnav); color: #fff; padding: 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 16px; }
.drawer-close { background: transparent; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
.drawer-body { flex: 1; overflow-y: auto; padding: 12px 0; }
.drawer-sec-title { padding: 8px 16px; font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.drawer-list { list-style: none; margin: 0; padding: 0; }
.drawer-list li button { width: 100%; text-align: right; background: transparent; border: 0; padding: 12px 16px; font-size: 14px; color: var(--text); display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-family: inherit; }
.drawer-list li button:hover, .drawer-list li button.active { background: var(--tabs); font-weight: 800; color: var(--primary); }
.cat-count { background: var(--tabs); color: var(--muted); border: 1px solid var(--border); font-size: 11px; padding: 2px 8px; border-radius: 12px; }
.drawer-divider { height: 1px; background: var(--border); margin: 10px 0; }

/* Floating Bottom Cart Bar */
.cartbar { position: fixed; inset: auto 12px calc(12px + env(safe-area-inset-bottom, 0)) 12px; z-index: 12; display: none; max-width: 560px; margin: 0 auto; }
.cartbar button { width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; background: #f08804; color: #111; font-weight: 900; font-size: 16px; box-shadow: 0 10px 25px rgba(0,0,0,.35); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }

/* Sheets & Modals (Cart + Quick View) */
.sheet { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; }
.sheet.on { display: flex; }
.panel { background: var(--card); width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 16px 14px calc(18px + env(safe-area-inset-bottom, 0)); }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.panel h2 { margin: 0; font-size: 18px; }
.clear-btn { background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-weight: 700; }

.line { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
.line-info { flex: 1; }
.line-info b { display: block; font-size: 14px; }
.line-info small { color: var(--muted); font-size: 12px; }
.line-ctrl { display: flex; align-items: center; gap: 6px; }
.line-ctrl button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--tabs); color: var(--text); font-weight: 800; cursor: pointer; }

.total { display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; margin: 12px 0; padding: 10px; background: var(--tabs); border-radius: 10px; }
.panel label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
.panel input, .panel textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--tabs); color: var(--text); font-size: 15px; font-family: inherit; }
.send { width: 100%; border: 0; border-radius: 12px; padding: 14px; margin-top: 14px; background: #128c4a; color: #fff; font-weight: 900; font-size: 16px; cursor: pointer; }
.ghost { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 11px; margin-top: 8px; background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; font-weight: 700; }

/* Quick View Modal */
.qv-img { width: 100%; height: 240px; background: #fff; border-radius: 12px; display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border); font-size: 56px; }
.qv-img img { width: 100%; height: 100%; object-fit: contain; }

.msg { text-align: center; color: var(--muted); padding: 50px 16px; line-height: 1.9; background: var(--card); border-radius: 12px; margin-top: 12px; border: 1px solid var(--border); }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 0 12px; }
.skel { background: linear-gradient(90deg, var(--tabs), var(--card), var(--tabs)); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }

@media (min-width: 700px) {
  .search-row { order: 0; width: auto; flex: 2; margin-top: 0; max-width: 520px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); }
}
</style>
</head>
<body>

<!-- Amazon Top Navigation -->
<header class="amz-header">
  <div class="nav-top">
    <div class="brand-area">
      <button type="button" class="menu-btn" id="openDrawer" aria-label="القائمة">☰ <span>الكل</span></button>
      <div class="shop-titles">
        <h1 id="shopName">…</h1>
        <p id="shopSub"></p>
      </div>
    </div>

    <div class="search-row">
      <div class="amz-search-box">
        <select id="searchCatSelect" class="search-cat-select" aria-label="اختر القسم">
          <option value="">كل الأقسام</option>
        </select>
        <input class="amz-search-input" id="q" type="search" placeholder="ابحث في المتجر..." aria-label="بحث">
        <button type="button" class="amz-search-btn" id="searchBtn" aria-label="ابحث">🔍</button>
      </div>
    </div>

    <div class="header-actions">
      <button type="button" class="theme-toggle" id="themeBtn" title="تغيير المظهر">🌓</button>
      <button type="button" class="top-cart-btn" id="topCartBtn">
        <span>🛒 السلة</span>
        <span class="top-cart-badge" id="topCartCount">0</span>
      </button>
    </div>
  </div>

  <!-- Sub-navigation Categories Bar -->
  <div class="nav-sub">
    <button type="button" class="all-cats-pill" id="openDrawerSub">☰ جميع الأقسام</button>
    <div class="cats" id="cats" role="group" aria-label="التصنيفات"></div>
  </div>
</header>

<!-- Side Drawer Menu (Amazon Style) -->
<div class="drawer-backdrop" id="drawerBackdrop">
  <aside class="drawer" aria-label="قائمة الأقسام">
    <div class="drawer-head">
      <span id="drawerShopTitle">أقسام المتجر</span>
      <button type="button" class="drawer-close" id="closeDrawer">✕</button>
    </div>
    <div class="drawer-body">
      <div class="drawer-sec-title">تصفح حسب القسم</div>
      <ul class="drawer-list" id="drawerCats"></ul>
      <div class="drawer-divider"></div>
      <div class="drawer-sec-title">خيارات العرض</div>
      <ul class="drawer-list">
        <li><button type="button" id="drawerStockToggle"><span>✅ إظهار المتوفر فقط</span></button></li>
        <li><button type="button" id="drawerThemeToggle"><span>🌓 تبديل الوضع الليلي / النهاري</span></button></li>
      </ul>
    </div>
  </aside>
</div>

<div class="wrap">
  <!-- Filter & Sort Bar -->
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="results-info" id="resultsCount">عرض المنتجات</div>
    <div class="controls-group">
      <label class="filter-chip">
        <input type="checkbox" id="onlyStock"> المتوفر فقط
      </label>
      <select class="sort-select" id="sortSelect" aria-label="ترتيب حسب">
        <option value="default">الترتيب الافتراضي</option>
        <option value="price_asc">السعر: من الأقل للأعلى</option>
        <option value="price_desc">السعر: من الأعلى للأقل</option>
        <option value="name_asc">الاسم: أ - ي</option>
      </select>
      <button type="button" class="view-btn active" id="gridViewBtn" title="عرض شبكي">⊞</button>
      <button type="button" class="view-btn" id="listViewBtn" title="عرض قائمة">☰</button>
    </div>
  </div>

  <main id="list" class="grid" aria-live="polite"></main>
  <div id="state" class="msg">جارٍ تحميل المتجر…</div>
  <footer>متجر يعمل بتطبيق الخيزران للمحاسبة</footer>
</div>

<!-- Floating Cart Bar -->
<div class="cartbar" id="cartbar">
  <button type="button" id="openCart">
    <span id="cartBarText">🛒 السلة</span>
    <span>إتمام الطلب ❯</span>
  </button>
</div>

<!-- Product Quick View Sheet -->
<div class="sheet" id="qvSheet" role="dialog" aria-modal="true">
  <div class="panel" id="qvContent"></div>
</div>

<!-- Checkout Cart Sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <div class="panel-head">
      <h2 id="sheetTitle">🛒 سلة المشتريات</h2>
      <button type="button" class="clear-btn" id="clearCartBtn">تفريغ السلة</button>
    </div>
    <div id="lines"></div>
    <div class="total"><span>المجموع الكلي</span><span id="sum"></span></div>
    <label for="cName">الاسم الكامل</label><input id="cName" autocomplete="name" placeholder="أدخل اسمك">
    <label for="cPhone">رقم الهاتف</label><input id="cPhone" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="09xxxxxxxx">
    <label for="cAddr">العنوان (للتوصيل)</label><input id="cAddr" autocomplete="street-address" placeholder="المدينة - الحي - الشارع">
    <label for="cNote">ملاحظات إضافية (اختياري)</label><textarea id="cNote" rows="2" placeholder="أي تفاصيل إضافية حول الطلب..."></textarea>
    <button type="button" class="send" id="send">📲 إرسال الطلب عبر واتساب</button>
    <button type="button" class="ghost" id="closeCart">متابعة التسوق</button>
  </div>
</div>

<script>
(function(){
'use strict';
const DB = 'https://jalal-khaizaran-default-rtdb.firebaseio.com';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code = (new URLSearchParams(location.search).get('s') || location.hash.replace('#','') || '').replace(/[^A-Za-z0-9]/g,'').slice(0,16);

let store = null, cart = {}, cat = '', term = '', sortBy = 'default', onlyAvailable = false;
const CART_KEY = 'khz_cart_' + code;
try { cart = JSON.parse(localStorage.getItem(CART_KEY) || '{}') || {}; } catch(_) { cart = {}; }
const saveCart = () => { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch(_) {} };

// Theme Management
const savedTheme = localStorage.getItem('khz_theme') || 'light';
if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
const toggleTheme = () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('khz_theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('khz_theme', 'dark');
  }
};
$('themeBtn').onclick = toggleTheme;
$('drawerThemeToggle').onclick = () => { toggleTheme(); closeDrawer(); };

const money = v => {
  const d = store && store.decimals ? 2 : 0;
  return Number(v || 0).toLocaleString('en-US', {maximumFractionDigits: d, minimumFractionDigits: 0}) + ' ' + (store && store.currency || '');
};
const norm = s => String(s || '').toLowerCase().replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');

// Drawer Controls
const openDrawer = () => $('drawerBackdrop').classList.add('on');
const closeDrawer = () => $('drawerBackdrop').classList.remove('on');
$('openDrawer').onclick = openDrawer;
$('openDrawerSub').onclick = openDrawer;
$('closeDrawer').onclick = closeDrawer;
$('drawerBackdrop').onclick = e => { if (e.target === $('drawerBackdrop')) closeDrawer(); };

async function load(){
  if (!code) { $('state').textContent = 'رابط المتجر غير مكتمل.'; return; }
  try {
    const r = await fetch(DB + '/stores/' + encodeURIComponent(code) + '.json', {cache: 'no-store'});
    store = await r.json();
  } catch(_) { store = null; }

  if (!store || !Array.isArray(store.products)) {
    $('state').innerHTML = 'تعذر العثور على هذا المتجر.<br>تأكد من الرابط أو تواصل مع صاحب المحل.';
    $('shopName').textContent = 'متجر غير موجود';
    return;
  }

  try {
    const ar = await fetch(DB + '/store_access/' + encodeURIComponent(store.ownerUid || '-') + '.json', {cache: 'no-store'});
    const acc = (await ar.json()) || {};
    const now = Date.now();
    const active = (Number(acc.paidUntil) || 0) > now || ((Number(acc.trialStart) || 0) && Number(acc.trialStart) + 30*864e5 > now);
    if (!active) {
      $('shopName').textContent = store.shopName || 'متجر';
      $('state').innerHTML = 'هذا المتجر متوقف مؤقتاً.<br>تواصل مع المحل مباشرة.' + (store.whatsapp ? '<br><br><a style="color:var(--primary);font-weight:bold" href="https://wa.me/' + String(store.whatsapp).replace(/\D/g,'').replace(/^00/,'') + '">💬 مراسلة المحل على واتساب</a>' : '');
      return;
    }
  } catch(_) {}

  document.title = store.shopName + ' — متجر';
  $('shopName').textContent = store.shopName || 'متجر';
  $('drawerShopTitle').textContent = 'أهلاً بك في ' + (store.shopName || 'المتجر');
  $('shopSub').textContent = [
    store.address ? '📍 ' + store.address : '',
    store.updatedAt ? ('تحديث: ' + new Date(store.updatedAt).toLocaleDateString('ar-SY-u-nu-latn')) : ''
  ].filter(Boolean).join(' · ');

  $('toolbar').style.display = 'flex';
  buildCategories();

  Object.keys(cart).forEach(id => {
    if (!store.products.some(p => String(p.id) === id)) delete cart[id];
  });
  render();
  renderCartBar();
}

function buildCategories(){
  const counts = {};
  store.products.forEach(p => {
    if (p.c) counts[p.c] = (counts[p.c] || 0) + 1;
  });
  const cats = Object.keys(counts);

  // Horizontal Bar
  $('cats').innerHTML = ['<button type="button" data-c="" aria-pressed="true">الكل</button>']
    .concat(cats.map(c => `<button type="button" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`)).join('');

  // Search Dropdown
  $('searchCatSelect').innerHTML = '<option value="">كل الأقسام</option>' +
    cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

  // Amazon Side Drawer List
  $('drawerCats').innerHTML = `<li><button type="button" data-c="" class="active"><span>جميع المنتجات</span><span class="cat-count">${store.products.length}</span></button></li>` +
    cats.map(c => `<li><button type="button" data-c="${esc(c)}"><span>${esc(c)}</span><span class="cat-count">${counts[c]}</span></button></li>`).join('');

  const selectCategory = selectedCat => {
    cat = selectedCat;
    $('searchCatSelect').value = cat;
    [...$('cats').children].forEach(x => x.setAttribute('aria-pressed', String(x.dataset.c === cat)));
    [...$('drawerCats').querySelectorAll('button')].forEach(x => x.classList.toggle('active', x.dataset.c === cat));
    render();
  };

  $('cats').onclick = e => {
    const b = e.target.closest('button');
    if (b) selectCategory(b.dataset.c);
  };
  $('drawerCats').onclick = e => {
    const b = e.target.closest('button');
    if (b) { selectCategory(b.dataset.c); closeDrawer(); }
  };
  $('searchCatSelect').onchange = e => selectCategory(e.target.value);
}

function render(){
  if (!store) return;
  const t = norm(term);
  let items = store.products.filter(p =>
    (!cat || p.c === cat) &&
    (!t || norm(p.n).includes(t) || norm(p.c || '').includes(t) || norm(p.u || '').includes(t)) &&
    (!onlyAvailable || p.s !== 0)
  );

  if (sortBy === 'price_asc') items.sort((a, b) => (Number(a.p) || 0) - (Number(b.p) || 0));
  else if (sortBy === 'price_desc') items.sort((a, b) => (Number(b.p) || 0) - (Number(a.p) || 0));
  else if (sortBy === 'name_asc') items.sort((a, b) => String(a.n || '').localeCompare(String(b.n || ''), 'ar'));

  $('resultsCount').innerHTML = `النتائج: <b>${items.length}</b> منتج` + (cat ? ` في قسم <b>${esc(cat)}</b>` : '');
  $('state').style.display = items.length ? 'none' : 'block';
  if (!items.length) $('state').textContent = 'لا توجد منتجات مطابقة لبحثك.';

  $('list').innerHTML = items.map(p => {
    const q = cart[p.id] || 0;
    const out = p.s === 0;
    const cachedSrc = imgCache[p.id];
    const hasValidCached = typeof cachedSrc === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(cachedSrc);

    return `<article class="item">
      <div class="ph" data-img="${esc(p.id)}" data-qv="${esc(p.id)}">
        ${p.c ? `<span class="cat-badge">${esc(p.c)}</span>` : ''}
        ${hasValidCached ? `<img src="${cachedSrc}" alt="${esc(p.n)}">` : (p.i ? '<span class="skel" style="width:100%;height:100%"></span>' : '🛍️')}
      </div>
      <div class="info">
        <div class="item-title" data-qv="${esc(p.id)}">${esc(p.n)}</div>
        ${p.u ? `<small>${esc(p.u)}</small>` : ''}
        <div class="price-box">
          <div class="price">${esc(money(p.p))}</div>
          ${out ? '<div class="out">غير متوفر حالياً</div>' : '<div class="stock-ok">✓ متوفر في المخزون</div>'}
        </div>
        ${q ? `<div class="qty"><button type="button" data-dec="${esc(p.id)}" aria-label="إنقاص">−</button><span>${q}</span><button type="button" data-inc="${esc(p.id)}" aria-label="زيادة">＋</button></div>` : `<button type="button" class="add" data-inc="${esc(p.id)}" ${out ? 'disabled' : ''}>أضف إلى السلة</button>`}
      </div>
    </article>`;
  }).join('');
  lazyImages();
}

const imgCache = {};
let io = null;
function lazyImages(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    loadImg(e.target);
  }), {rootMargin: '200px'});
  document.querySelectorAll('.ph[data-img]').forEach(el => {
    const id = el.dataset.img;
    if (id in imgCache) return;
    const p = store.products.find(x => String(x.id) === id);
    if (p && p.i) io.observe(el);
  });
}

async function loadImg(el){
  const id = el.dataset.img;
  try {
    if (!(id in imgCache)) {
      const r = await fetch(DB + '/stores_img/' + encodeURIComponent(code) + '/' + encodeURIComponent(id) + '.json');
      imgCache[id] = await r.json();
    }
    const src = imgCache[id];
    const badge = el.querySelector('.cat-badge');
    if (typeof src === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(src)) {
      el.innerHTML = '';
      if (badge) el.appendChild(badge);
      const im = new Image();
      im.alt = '';
      im.src = src;
      el.appendChild(im);
    } else {
      el.innerHTML = (badge ? badge.outerHTML : '') + '🛍️';
    }
  } catch(_) {
    el.textContent = '🛍️';
  }
}

// Quick View Product Modal
function openQuickView(id){
  const p = store.products.find(x => String(x.id) === String(id));
  if (!p) return;
  const q = cart[p.id] || 0;
  const out = p.s === 0;
  const src = imgCache[p.id];
  const hasImg = typeof src === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(src);

  $('qvContent').innerHTML = `
    <div class="panel-head">
      <h2>تفاصيل المنتج</h2>
      <button type="button" class="drawer-close" style="color:var(--text)" id="closeQv">✕</button>
    </div>
    <div class="qv-img">${hasImg ? `<img src="${src}" alt="${esc(p.n)}">` : '🛍️'}</div>
    ${p.c ? `<small style="color:var(--primary);font-weight:700">القسم: ${esc(p.c)}</small>` : ''}
    <h3 style="margin:6px 0">${esc(p.n)}</h3>
    ${p.u ? `<p style="color:var(--muted);margin:4px 0 10px;font-size:14px">${esc(p.u)}</p>` : ''}
    <div class="price" style="font-size:22px;margin-bottom:8px">${esc(money(p.p))}</div>
    <div style="margin-bottom:14px">${out ? '<span class="out">غير متوفر حالياً</span>' : '<span class="stock-ok">✓ متوفر وجاهز للطلب</span>'}</div>
    ${q ? `<div class="qty" style="max-width:200px;margin:0 auto"><button type="button" data-dec="${esc(p.id)}">−</button><span>${q}</span><button type="button" data-inc="${esc(p.id)}">＋</button></div>` : `<button type="button" class="add" style="width:100%;padding:12px" data-inc="${esc(p.id)}" ${out ? 'disabled' : ''}>أضف إلى السلة</button>`}
  `;
  $('qvSheet').classList.add('on');
  $('closeQv').onclick = () => $('qvSheet').classList.remove('on');
}

document.addEventListener('click', e => {
  const inc = e.target.closest('[data-inc]');
  const dec = e.target.closest('[data-dec]');
  const qv = e.target.closest('[data-qv]');

  if (inc) {
    const id = inc.dataset.inc;
    cart[id] = (cart[id] || 0) + 1;
    saveCart();
    render();
    renderCartBar();
    renderLines();
    if ($('qvSheet').classList.contains('on')) openQuickView(id);
    return;
  }
  if (dec) {
    const id = dec.dataset.dec;
    cart[id] = Math.max(0, (cart[id] || 0) - 1);
    if (!cart[id]) delete cart[id];
    saveCart();
    render();
    renderCartBar();
    renderLines();
    if ($('qvSheet').classList.contains('on')) openQuickView(id);
    return;
  }
  if (qv && !e.target.closest('button')) {
    openQuickView(qv.dataset.qv);
  }
});

function cartItems(){
  return Object.entries(cart)
    .map(([id, q]) => ({p: store.products.find(x => String(x.id) === id), q}))
    .filter(x => x.p && x.q > 0);
}

function renderCartBar(){
  if (!store) return;
  const it = cartItems();
  const n = it.reduce((a, x) => a + x.q, 0);
  const totalMoney = money(it.reduce((a, x) => a + x.q * x.p.p, 0));
  $('topCartCount').textContent = n;
  $('cartbar').style.display = n ? 'block' : 'none';
  $('cartBarText').textContent = '🛒 السلة (' + n + ') — ' + totalMoney;
}

function renderLines(){
  if (!store) return;
  const it = cartItems();
  $('lines').innerHTML = it.map(x => `
    <div class="line">
      <div class="line-info">
        <b>${esc(x.p.n)}</b>
        <small>${esc(money(x.p.p))} × ${x.q} = <strong>${esc(money(x.q * x.p.p))}</strong></small>
      </div>
      <div class="line-ctrl">
        <button type="button" data-dec="${esc(x.p.id)}">−</button>
        <span>${x.q}</span>
        <button type="button" data-inc="${esc(x.p.id)}">＋</button>
      </div>
    </div>
  `).join('') || '<div class="msg" style="padding:20px;margin:0">السلة فارغة حالياً</div>';
  $('sum').textContent = money(it.reduce((a, x) => a + x.q * x.p.p, 0));
}

const showCartModal = () => {
  renderLines();
  try {
    const c = JSON.parse(localStorage.getItem('khz_customer') || '{}');
    ['cName','cPhone','cAddr'].forEach(k => { if (c[k] && !$(k).value) $(k).value = c[k]; });
  } catch(_) {}
  $('sheet').classList.add('on');
};

$('openCart').onclick = showCartModal;
$('topCartBtn').onclick = showCartModal;
$('closeCart').onclick = () => $('sheet').classList.remove('on');
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').classList.remove('on'); };
$('qvSheet').onclick = e => { if (e.target === $('qvSheet')) $('qvSheet').classList.remove('on'); };

$('clearCartBtn').onclick = () => {
  if (!Object.keys(cart).length) return;
  cart = {};
  saveCart();
  render();
  renderCartBar();
  renderLines();
};

// Search, Filter & View Listeners
$('q').oninput = e => { term = e.target.value; render(); };
$('searchBtn').onclick = () => render();
$('sortSelect').onchange = e => { sortBy = e.target.value; render(); };
$('onlyStock').onchange = e => { onlyAvailable = e.target.checked; render(); };
$('drawerStockToggle').onclick = () => {
  onlyAvailable = !onlyAvailable;
  $('onlyStock').checked = onlyAvailable;
  render();
  closeDrawer();
};

$('gridViewBtn').onclick = () => {
  $('list').classList.remove('list-view');
  $('gridViewBtn').classList.add('active');
  $('listViewBtn').classList.remove('active');
};
$('listViewBtn').onclick = () => {
  $('list').classList.add('list-view');
  $('listViewBtn').classList.add('active');
  $('gridViewBtn').classList.remove('active');
};

$('send').onclick = () => {
  const it = cartItems();
  if (!it.length) return;
  const name = $('cName').value.trim(), phone = $('cPhone').value.trim(), addr = $('cAddr').value.trim();
  if (!name || !phone) { alert('اكتب اسمك ورقم هاتفك حتى يتواصل معك المحل.'); return; }
  try { localStorage.setItem('khz_customer', JSON.stringify({cName: name, cPhone: phone, cAddr: addr})); } catch(_) {}
  const lines = it.map(x => '• ' + x.p.n + ' × ' + x.q + ' = ' + money(x.q * x.p.p));
  const text = '🛒 طلب جديد من متجر ' + store.shopName + '\n\n' + lines.join('\n') + '\n\nالمجموع: ' + money(it.reduce((a, x) => a + x.q * x.p.p, 0)) + '\n\n👤 ' + name + '\n📞 ' + phone + (addr ? '\n📍 ' + addr : '') + ($('cNote').value.trim() ? '\n📝 ' + $('cNote').value.trim() : '');
  const wa = String(store.whatsapp || '').replace(/\D/g,'').replace(/^00/,'');
  window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(text), '_blank');
};

load();
})();
</script>
</body>
</html>
