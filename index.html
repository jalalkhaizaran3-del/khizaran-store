<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b132b">
<title>متجر — الخيزران</title>
<style>
:root{--bg:#0b132b;--card:#14213d;--tabs:#1c2b4a;--text:#eef2ff;--muted:#9aa8c7;--primary:#4ea8de;--success:#34d399;--border:#26375c;--danger:#f87171}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f6fb;--card:#ffffff;--tabs:#eef2f8;--text:#14213d;--muted:#5b6b8a;--primary:#2b7bbf;--success:#059669;--border:#dde3ee}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 calc(80px + env(safe-area-inset-bottom,0))}
.wrap{max-width:980px;margin:0 auto;padding:0 12px}
header{padding:18px 0 10px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;color:var(--muted);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px}
.cats{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--tabs);display:grid;place-items:center;font-size:34px;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.info b{font-size:14px;line-height:1.4}
.info small{color:var(--muted);font-size:12px}
.price{font-weight:800;color:var(--success);font-size:15px}
.out{color:var(--danger);font-size:12px;font-weight:700}
.add{margin-top:auto;border:0;border-radius:10px;padding:9px;background:var(--primary);color:#fff;font-weight:800;font-size:14px;cursor:pointer}
.add[disabled]{opacity:.45;cursor:not-allowed}
.qty{margin-top:auto;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:6px}
.qty button{border:1px solid var(--border);background:var(--tabs);color:var(--text);border-radius:10px;height:38px;font-size:18px;cursor:pointer}
.qty span{text-align:center;font-weight:800}
.cartbar{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0)) 12px;z-index:10;display:none}
.cartbar button{width:100%;border:0;border-radius:16px;padding:14px;background:var(--success);color:#062a1d;font-weight:900;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0))}
.panel h2{margin:0 0 10px;font-size:18px}
.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:17px;margin:10px 0}
.panel label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.panel input,.panel textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--tabs);color:var(--text);font-size:15px;font-family:inherit}
.send{width:100%;border:0;border-radius:14px;padding:14px;margin-top:14px;background:#128c4a;color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.ghost{width:100%;border:1px solid var(--border);border-radius:14px;padding:11px;margin-top:8px;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.msg{text-align:center;color:var(--muted);padding:50px 16px;line-height:1.9}
footer{text-align:center;color:var(--muted);font-size:11px;padding:24px 0 8px;opacity:.75}
.skel{background:linear-gradient(90deg,var(--tabs),var(--card),var(--tabs));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="shopName">…</h1><p id="shopSub"></p></header>
  <div class="bar"><input class="search" id="q" type="search" placeholder="🔍 ابحث عن منتج" aria-label="بحث"><div class="cats" id="cats" role="group" aria-label="التصنيفات"></div></div>
  <main id="list" class="grid" aria-live="polite"></main>
  <div id="state" class="msg">جارٍ تحميل المتجر…</div>
  <footer>متجر يعمل بتطبيق الخيزران للمحاسبة</footer>
</div>
<div class="cartbar" id="cartbar"><button type="button" id="openCart">🛒 السلة</button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="panel">
  <h2 id="sheetTitle">🛒 طلبيتك</h2><div id="lines"></div><div class="total"><span>المجموع</span><span id="sum"></span></div>
  <label for="cName">الاسم</label><input id="cName" autocomplete="name">
  <label for="cPhone">رقم الهاتف</label><input id="cPhone" inputmode="tel" autocomplete="tel" dir="ltr">
  <label for="cAddr">العنوان (للتوصيل)</label><input id="cAddr" autocomplete="street-address">
  <label for="cNote">ملاحظات (اختياري)</label><textarea id="cNote" rows="2"></textarea>
  <button type="button" class="send" id="send">📲 إرسال الطلب عبر واتساب</button>
  <button type="button" class="ghost" id="closeCart">متابعة التسوق</button>
</div></div>
<script>
(function(){
'use strict';
const DB='https://jalal-khaizaran-default-rtdb.firebaseio.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=(new URLSearchParams(location.search).get('s')||location.hash.replace('#','')||'').replace(/[^A-Za-z0-9]/g,'').slice(0,16);
let store=null,cart={},cat='',term='';
const CART_KEY='khz_cart_'+code;
try{cart=JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{};}catch(_){cart={};}
const saveCart=()=>{try{localStorage.setItem(CART_KEY,JSON.stringify(cart));}catch(_){}};
const money=v=>{const d=store&&store.decimals?2:0;return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0})+' '+(store&&store.currency||'');};
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
async function load(){
  if(!code){$('state').textContent='رابط المتجر غير مكتمل.';return;}
  try{const r=await fetch(DB+'/stores/'+encodeURIComponent(code)+'.json',{cache:'no-store'});store=await r.json();}catch(_){store=null;}
  if(!store||!Array.isArray(store.products)){$('state').innerHTML='تعذر العثور على هذا المتجر.<br>تأكد من الرابط أو تواصل مع صاحب المحل.';$('shopName').textContent='متجر غير موجود';return;}
  try{const ar=await fetch(DB+'/store_access/'+encodeURIComponent(store.ownerUid||'-')+'.json',{cache:'no-store'});const acc=(await ar.json())||{};const now=Date.now();
    const active=(Number(acc.paidUntil)||0)>now||((Number(acc.trialStart)||0)&&Number(acc.trialStart)+30*864e5>now);
    if(!active){$('shopName').textContent=store.shopName||'متجر';$('state').innerHTML='هذا المتجر متوقف مؤقتاً.<br>تواصل مع المحل مباشرة.'+(store.whatsapp?'<br><br><a style="color:var(--primary)" href="https://wa.me/'+String(store.whatsapp).replace(/\D/g,'').replace(/^00/,'')+'">💬 مراسلة المحل على واتساب</a>':'');return;}}catch(_){}
  document.title=store.shopName+' — متجر';$('shopName').textContent=store.shopName||'متجر';
  $('shopSub').textContent=[store.address,store.updatedAt?('آخر تحديث للأسعار: '+new Date(store.updatedAt).toLocaleDateString('ar-SY')):''].filter(Boolean).join(' · ');
  const cats=[...new Set(store.products.map(p=>p.c).filter(Boolean))];
  $('cats').innerHTML=cats.length?['<button type="button" data-c="" aria-pressed="true">الكل</button>'].concat(cats.map(c=>`<button type="button" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`)).join(''):'';
  $('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;[...$('cats').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();};
  Object.keys(cart).forEach(id=>{if(!store.products.some(p=>String(p.id)===id))delete cart[id];});
  render();renderCartBar();
}
function render(){
  const t=norm(term);const items=store.products.filter(p=>(!cat||p.c===cat)&&(!t||norm(p.n).includes(t)));
  $('state').style.display=items.length?'none':'block';if(!items.length)$('state').textContent='لا توجد منتجات مطابقة.';
  $('list').innerHTML=items.map(p=>{const q=cart[p.id]||0;const out=p.s===0;
    return `<article class="item"><div class="ph" data-img="${esc(p.id)}">${p.i?'<span class="skel" style="width:100%;height:100%"></span>':'🛍️'}</div><div class="info"><b>${esc(p.n)}</b>${p.u?`<small>${esc(p.u)}</small>`:''}<div class="price">${esc(money(p.p))}</div>${out?'<div class="out">غير متوفر حالياً</div>':''}
    ${q?`<div class="qty"><button type="button" data-dec="${esc(p.id)}" aria-label="إنقاص">−</button><span>${q}</span><button type="button" data-inc="${esc(p.id)}" aria-label="زيادة">＋</button></div>`:`<button type="button" class="add" data-inc="${esc(p.id)}" ${out?'disabled':''}>أضف للسلة</button>`}</div></article>`;}).join('');
  lazyImages();
}
const imgCache={};let io=null;
function lazyImages(){if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);loadImg(e.target);}),{rootMargin:'200px'});
  document.querySelectorAll('.ph[data-img]').forEach(el=>{const p=store.products.find(x=>String(x.id)===el.dataset.img);if(p&&p.i)io.observe(el);});}
async function loadImg(el){const id=el.dataset.img;try{if(!(id in imgCache)){const r=await fetch(DB+'/stores_img/'+encodeURIComponent(code)+'/'+encodeURIComponent(id)+'.json');imgCache[id]=await r.json();}
  const src=imgCache[id];if(typeof src==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(src)){el.innerHTML='';const im=new Image();im.alt='';im.src=src;el.appendChild(im);}else el.textContent='🛍️';}catch(_){el.textContent='🛍️';}}
document.addEventListener('click',e=>{const inc=e.target.closest('[data-inc]'),dec=e.target.closest('[data-dec]');
  if(inc){const id=inc.dataset.inc;cart[id]=(cart[id]||0)+1;saveCart();render();renderCartBar();}
  if(dec){const id=dec.dataset.dec;cart[id]=Math.max(0,(cart[id]||0)-1);if(!cart[id])delete cart[id];saveCart();render();renderCartBar();renderLines();}});
function cartItems(){return Object.entries(cart).map(([id,q])=>({p:store.products.find(x=>String(x.id)===id),q})).filter(x=>x.p&&x.q>0);}
function renderCartBar(){const it=cartItems();const n=it.reduce((a,x)=>a+x.q,0);$('cartbar').style.display=n?'block':'none';$('openCart').textContent='🛒 السلة ('+n+') — '+money(it.reduce((a,x)=>a+x.q*x.p.p,0));}
function renderLines(){const it=cartItems();$('lines').innerHTML=it.map(x=>`<div class="line"><span>${esc(x.p.n)} × ${x.q}</span><span>${esc(money(x.q*x.p.p))}</span></div>`).join('')||'<div class="msg" style="padding:20px">السلة فارغة</div>';$('sum').textContent=money(it.reduce((a,x)=>a+x.q*x.p.p,0));}
$('openCart').onclick=()=>{renderLines();try{const c=JSON.parse(localStorage.getItem('khz_customer')||'{}');['cName','cPhone','cAddr'].forEach(k=>{if(c[k]&&!$(k).value)$(k).value=c[k];});}catch(_){}$('sheet').classList.add('on');};
$('closeCart').onclick=()=>$('sheet').classList.remove('on');
$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.remove('on');};
$('q').oninput=e=>{term=e.target.value;render();};
$('send').onclick=()=>{const it=cartItems();if(!it.length)return;const name=$('cName').value.trim(),phone=$('cPhone').value.trim(),addr=$('cAddr').value.trim();
  if(!name||!phone){alert('اكتب اسمك ورقم هاتفك حتى يتواصل معك المحل.');return;}
  try{localStorage.setItem('khz_customer',JSON.stringify({cName:name,cPhone:phone,cAddr:addr}));}catch(_){}
  const lines=it.map(x=>'• '+x.p.n+' × '+x.q+' = '+money(x.q*x.p.p));
  const text='🛒 طلب جديد من متجر '+store.shopName+'\n\n'+lines.join('\n')+'\n\nالمجموع: '+money(it.reduce((a,x)=>a+x.q*x.p.p,0))+'\n\n👤 '+name+'\n📞 '+phone+(addr?'\n📍 '+addr:'')+($('cNote').value.trim()?'\n📝 '+$('cNote').value.trim():'');
  const wa=String(store.whatsapp||'').replace(/\D/g,'').replace(/^00/,'');
  window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(text),'_blank');};
load();
})();
</script>
</body>
</html>
