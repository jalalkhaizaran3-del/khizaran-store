<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>متجر — الخيزران</title>
<style>
:root {
  --bg: #070b14;
  --bg-grad-1: rgba(0, 113, 227, 0.22);
  --bg-grad-2: rgba(52, 211, 153, 0.14);
  --glass: rgba(22, 30, 49, 0.68);
  --glass-heavy: rgba(15, 22, 38, 0.88);
  --glass-card: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-highlight: rgba(255, 255, 255, 0.08);
  --text: #f5f5f7;
  --muted: #94a3b8;
  --primary: #0071e3;
  --primary-hover: #0077ed;
  --success: #30d158;
  --danger: #ff453a;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 12px;
}

html[data-theme="light"] {
  --bg: #f2f4f8;
  --bg-grad-1: rgba(0, 113, 227, 0.12);
  --bg-grad-2: rgba(52, 211, 153, 0.10);
  --glass: rgba(255, 255, 255, 0.72);
  --glass-heavy: rgba(255, 255, 255, 0.90);
  --glass-card: rgba(255, 255, 255, 0.78);
  --glass-border: rgba(0, 0, 0, 0.08);
  --glass-highlight: rgba(0, 0, 0, 0.04);
  --text: #1d1d1f;
  --muted: #6e6e73;
  --primary: #0071e3;
  --primary-hover: #005bb5;
  --success: #00802b;
  --danger: #d70015;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 15% 10%, var(--bg-grad-1), transparent 45%),
    radial-gradient(circle at 85% 80%, var(--bg-grad-2), transparent 50%);
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Tahoma, Arial, sans-serif;
  min-height: 100vh;
}
body {
  padding: env(safe-area-inset-top, 0) 0 calc(115px + env(safe-area-inset-bottom, 0));
}

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 14px; }

/* Apple Frosted Top Header */
.top-glass {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--glass);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border-bottom: 1px solid var(--glass-border);
  padding: 12px 0 10px;
  transition: background .25s;
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand-box { display: flex; flex-direction: column; gap: 2px; }
.brand-box h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.3px;
}
.brand-box p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-pill {
  background: var(--glass-highlight);
  border: 1px solid var(--glass-border);
  color: var(--text);
  height: 38px;
  padding: 0 12px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .15s, background .2s;
}
.icon-pill:active { transform: scale(0.95); }

/* Search & Filter Bar */
.search-toolbar {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  align-items: center;
}
.search-wrap {
  position: relative;
  flex: 1;
}
.search {
  width: 100%;
  padding: 11px 14px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass-card);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.25);
}
.sort-select {
  padding: 10px 10px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass-card);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  cursor: pointer;
}

/* Apple Pill Categories */
.cats {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-top: 10px;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cats button {
  flex: 0 0 auto;
  border: 1px solid var(--glass-border);
  background: var(--glass-card);
  color: var(--muted);
  border-radius: 20px;
  padding: 7px 15px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all .2s ease;
}
.cats button[aria-pressed="true"] {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 4px 14px rgba(0, 113, 227, 0.4);
}

/* Sub-status bar */
.sub-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 2px 10px;
  font-size: 13px;
  color: var(--muted);
}
.stock-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  background: var(--glass-card);
  border: 1px solid var(--glass-border);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  color: var(--text);
}
.stock-toggle input { accent-color: var(--primary); margin: 0; }

/* Product Grid & Glass Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}
@media (min-width: 640px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
}

.item {
  background: var(--glass-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  transition: transform .22s ease, border-color .22s ease;
  position: relative;
}
.item:hover {
  transform: translateY(-3px);
  border-color: rgba(0, 113, 227, 0.45);
}

.ph {
  aspect-ratio: 1/1;
  background: var(--glass-highlight);
  display: grid;
  place-items: center;
  font-size: 40px;
  color: var(--muted);
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.ph img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .35s ease;
}
.item:hover .ph img { transform: scale(1.04); }

.badge-cat {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--glass-heavy);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
  color: var(--text);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 12px;
  z-index: 2;
}

.info {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
}
.info b {
  font-size: 14px;
  line-height: 1.4;
  cursor: pointer;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.info small { color: var(--muted); font-size: 12px; }
.price-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-top: 2px;
  margin-bottom: 6px;
}
.price { font-weight: 800; color: var(--success); font-size: 16px; }
.out { color: var(--danger); font-size: 11px; font-weight: 700; }

.add {
  margin-top: auto;
  border: 0;
  border-radius: 14px;
  padding: 10px;
  background: var(--primary);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: background .2s, transform .12s;
}
.add:hover:not([disabled]) { background: var(--primary-hover); }
.add:active:not([disabled]) { transform: scale(0.97); }
.add[disabled] { opacity: .4; cursor: not-allowed; }

.qty {
  margin-top: auto;
  display: grid;
  grid-template-columns: 36px 1fr 36px;
  align-items: center;
  gap: 4px;
  background: var(--glass-highlight);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 2px;
}
.qty button {
  border: 0;
  background: var(--glass-card);
  color: var(--text);
  border-radius: 11px;
  height: 32px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}
.qty span { text-align: center; font-weight: 800; font-size: 14px; }

/* Apple Floating Bottom Navigation Bar (iOS Tab Bar) */
.bottom-nav-wrap {
  position: fixed;
  inset: auto 12px calc(10px + env(safe-area-inset-bottom, 0)) 12px;
  z-index: 25;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.bottom-nav {
  pointer-events: auto;
  width: 100%;
  max-width: 480px;
  background: var(--glass-heavy);
  backdrop-filter: blur(25px) saturate(190%);
  -webkit-backdrop-filter: blur(25px) saturate(190%);
  border: 1px solid var(--glass-border);
  border-radius: 26px;
  padding: 6px 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
}
.nav-tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 7px 4px;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  transition: color .2s, background .2s;
}
.nav-tab .ico { font-size: 19px; line-height: 1; }
.nav-tab.active {
  color: var(--text);
  background: var(--glass-highlight);
}
.nav-badge {
  position: absolute;
  top: 3px;
  right: 18%;
  background: var(--primary);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 10px;
  display: none;
  align-items: center;
  justify-content: center;
}

/* Sheets & Modals (Cart, Categories, Quick View) */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.sheet.on { display: flex; }
.panel {
  background: var(--glass-heavy);
  backdrop-filter: blur(30px) saturate(190%);
  -webkit-backdrop-filter: blur(30px) saturate(190%);
  border-top: 1px solid var(--glass-border);
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow: auto;
  border-radius: 28px 28px 0 0;
  padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0));
  box-shadow: var(--shadow);
}
.sheet-handle {
  width: 40px;
  height: 5px;
  background: var(--glass-border);
  border-radius: 10px;
  margin: 0 auto 14px;
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.panel h2 { margin: 0; font-size: 19px; font-weight: 800; }
.close-ico {
  background: var(--glass-highlight);
  border: 1px solid var(--glass-border);
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 15px;
  cursor: pointer;
}

/* Cart Lines */
.line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--glass-border);
  font-size: 14px;
}
.line-meta { flex: 1; }
.line-meta b { display: block; font-size: 14px; }
.line-meta small { color: var(--muted); font-size: 12px; }
.line-qty {
  display: flex;
  align-items: center;
  gap: 6px;
}
.line-qty button {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid var(--glass-border);
  background: var(--glass-card);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}

.total {
  display: flex;
  justify-content: space-between;
  font-weight: 900;
  font-size: 18px;
  margin: 14px 0;
  padding: 12px 14px;
  background: var(--glass-highlight);
  border-radius: var(--radius-md);
  border: 1px solid var(--glass-border);
}
.panel label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin: 10px 0 4px;
}
.panel input, .panel textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass-card);
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  outline: none;
}
.panel input:focus, .panel textarea:focus { border-color: var(--primary); }

.send {
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 14px;
  margin-top: 14px;
  background: #25d366;
  color: #052912;
  font-weight: 900;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
}
.ghost {
  width: 100%;
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 12px;
  margin-top: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

/* Categories Sheet Grid */
.cat-sheet-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.cat-card-btn {
  background: var(--glass-card);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 14px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  text-align: right;
}
.cat-card-btn.active {
  border-color: var(--primary);
  background: rgba(0, 113, 227, 0.18);
}
.cat-card-btn span.cnt {
  background: var(--glass-highlight);
  color: var(--muted);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
}

/* Quick View Image */
.qv-box {
  aspect-ratio: 16/11;
  background: var(--glass-card);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  overflow: hidden;
  display: grid;
  place-items: center;
  font-size: 54px;
  margin-bottom: 14px;
}
.qv-box img { width: 100%; height: 100%; object-fit: contain; }

.msg {
  text-align: center;
  color: var(--muted);
  padding: 50px 16px;
  line-height: 1.9;
  background: var(--glass-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  margin-top: 14px;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 28px 0 8px;
  opacity: .8;
}
.skel {
  background: linear-gradient(90deg, var(--glass-highlight), var(--glass-card), var(--glass-highlight));
  background-size: 200% 100%;
  animation: sk 1.2s infinite;
}
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>

<!-- Frosted Glass Top Header -->
<header class="top-glass">
  <div class="wrap">
    <div class="header-row">
      <div class="brand-box">
        <h1 id="shopName">…</h1>
        <p id="shopSub"></p>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-pill" id="themeBtn" aria-label="تبديل المظهر">
          <span id="themeIco">☀️</span>
        </button>
      </div>
    </div>

    <div class="search-toolbar" id="searchArea">
      <div class="search-wrap">
        <input class="search" id="q" type="search" placeholder="🔍 ابحث عن منتج أو قسم..." aria-label="بحث">
      </div>
      <select class="sort-select" id="sortSelect" aria-label="ترتيب المنتجات">
        <option value="default">الترتيب</option>
        <option value="price_asc">الأرخص أولاً</option>
        <option value="price_desc">الأغلى أولاً</option>
        <option value="name_asc">أبجدياً</option>
      </select>
    </div>

    <div class="cats" id="cats" role="group" aria-label="التصنيفات"></div>
  </div>
</header>

<div class="wrap">
  <div class="sub-bar" id="subBar" style="display:none">
    <span id="countLabel">جميع المنتجات</span>
    <label class="stock-toggle">
      <input type="checkbox" id="onlyStock"> المتوفر فقط
    </label>
  </div>

  <main id="list" class="grid" aria-live="polite"></main>
  <div id="state" class="msg">جارٍ تحميل المتجر…</div>
  <footer>متجر يعمل بتطبيق الخيزران للمحاسبة</footer>
</div>

<!-- Apple iOS Style Bottom Navigation Bar -->
<nav class="bottom-nav-wrap" aria-label="التنقل السريع">
  <div class="bottom-nav">
    <button type="button" class="nav-tab active" id="navHome">
      <span class="ico">🏠</span>
      <span>الرئيسية</span>
    </button>
    <button type="button" class="nav-tab" id="navCats">
      <span class="ico">🗂️</span>
      <span>الأقسام</span>
    </button>
    <button type="button" class="nav-tab" id="navSearch">
      <span class="ico">🔍</span>
      <span>البحث</span>
    </button>
    <button type="button" class="nav-tab" id="openCart">
      <span class="ico">🛍️</span>
      <span id="navCartLabel">الحقيبة</span>
      <span class="nav-badge" id="cartBadge">0</span>
    </button>
  </div>
</nav>

<!-- Categories Glass Sheet -->
<div class="sheet" id="catSheet" role="dialog" aria-modal="true" aria-labelledby="catSheetTitle">
  <div class="panel">
    <div class="sheet-handle"></div>
    <div class="panel-head">
      <h2 id="catSheetTitle">🗂️ تصفح الأقسام</h2>
      <button type="button" class="close-ico" id="closeCatSheet">✕</button>
    </div>
    <div class="cat-sheet-grid" id="catSheetList"></div>
  </div>
</div>

<!-- Product Quick View Sheet -->
<div class="sheet" id="qvSheet" role="dialog" aria-modal="true">
  <div class="panel" id="qvPanel"></div>
</div>

<!-- Shopping Bag / Checkout Sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <div class="sheet-handle"></div>
    <div class="panel-head">
      <h2 id="sheetTitle">🛍️ حقيبة التسوق</h2>
      <button type="button" class="close-ico" id="closeCart">✕</button>
    </div>
    <div id="lines"></div>
    <div class="total"><span>المجموع</span><span id="sum"></span></div>
    <label for="cName">الاسم</label><input id="cName" autocomplete="name" placeholder="الاسم الكامل">
    <label for="cPhone">رقم الهاتف</label><input id="cPhone" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="09xxxxxxxx">
    <label for="cAddr">العنوان (للتوصيل)</label><input id="cAddr" autocomplete="street-address" placeholder="المدينة - الحي - الشارع">
    <label for="cNote">ملاحظات (اختياري)</label><textarea id="cNote" rows="2" placeholder="أي تفاصيل إضافية..."></textarea>
    <button type="button" class="send" id="send">📲 إرسال الطلب عبر واتساب</button>
    <button type="button" class="ghost" id="continueBtn">متابعة التسوق</button>
  </div>
</div>

<script>
(function(){
'use strict';
const DB = 'https://jalal-khaizaran-default-rtdb.firebaseio.com';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code = (new URLSearchParams(location.search).get('s') || location.hash.replace('#','') || '').replace(/[^A-Za-z0-9]/g,'').slice(0,16);

let store = null, cart = {}, cat = '', term = '', sortBy = 'default', onlyStock = false;
const CART_KEY = 'khz_cart_' + code;
try { cart = JSON.parse(localStorage.getItem(CART_KEY) || '{}') || {}; } catch(_) { cart = {}; }
const saveCart = () => { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch(_) {} };

// Theme Setup
const savedTheme = localStorage.getItem('khz_glass_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
$('themeIco').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
$('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', cur);
  localStorage.setItem('khz_glass_theme', cur);
  $('themeIco').textContent = cur === 'dark' ? '☀️' : '🌙';
};

const money = v => {
  const d = store && store.decimals ? 2 : 0;
  return Number(v || 0).toLocaleString('en-US', {maximumFractionDigits: d, minimumFractionDigits: 0}) + ' ' + (store && store.currency || '');
};
const norm = s => String(s || '').toLowerCase().replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');

async function load(){
  if (!code) { $('state').textContent = 'رابط المتجر غير مكتمل.'; return; }
  try {
    const r = await fetch(DB + '/stores/' + encodeURIComponent(code) + '.json', {cache: 'no-store'});
    store = await r.json();
  } catch(_) { store = null; }

  if (!store || !Array.isArray(store.products)) {
    $('state').innerHTML = 'تعذر العثور على هذا المتجر.<br>تأكد من الرابط أو تواصل مع صاحب المحل.';
    $('shopName').textContent = 'متجر غير موجود';
    return;
  }

  try {
    const ar = await fetch(DB + '/store_access/' + encodeURIComponent(store.ownerUid || '-') + '.json', {cache: 'no-store'});
    const acc = (await ar.json()) || {};
    const now = Date.now();
    const active = (Number(acc.paidUntil) || 0) > now || ((Number(acc.trialStart) || 0) && Number(acc.trialStart) + 30*864e5 > now);
    if (!active) {
      $('shopName').textContent = store.shopName || 'متجر';
      $('state').innerHTML = 'هذا المتجر متوقف مؤقتاً.<br>تواصل مع المحل مباشرة.' + (store.whatsapp ? '<br><br><a style="color:var(--primary)" href="https://wa.me/' + String(store.whatsapp).replace(/\D/g,'').replace(/^00/,'') + '">💬 مراسلة المحل على واتساب</a>' : '');
      return;
    }
  } catch(_) {}

  document.title = store.shopName + ' — متجر';
  $('shopName').textContent = store.shopName || 'متجر';
  $('shopSub').textContent = [
    store.address,
    store.updatedAt ? ('آخر تحديث للأسعار: ' + new Date(store.updatedAt).toLocaleDateString('ar-SY-u-nu-latn')) : ''
  ].filter(Boolean).join(' · ');

  $('subBar').style.display = 'flex';
  buildCategories();

  Object.keys(cart).forEach(id => {
    if (!store.products.some(p => String(p.id) === id)) delete cart[id];
  });
  render();
  renderCartBar();
}

function buildCategories(){
  const counts = {};
  store.products.forEach(p => { if (p.c) counts[p.c] = (counts[p.c] || 0) + 1; });
  const cats = Object.keys(counts);

  $('cats').innerHTML = cats.length ? ['<button type="button" data-c="" aria-pressed="true">الكل</button>']
    .concat(cats.map(c => `<button type="button" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`)).join('') : '';

  $('catSheetList').innerHTML = `<button type="button" class="cat-card-btn active" data-c=""><span>الكل</span><span class="cnt">${store.products.length}</span></button>` +
    cats.map(c => `<button type="button" class="cat-card-btn" data-c="${esc(c)}"><span>${esc(c)}</span><span class="cnt">${counts[c]}</span></button>`).join('');

  const applyCat = cVal => {
    cat = cVal;
    [...$('cats').children].forEach(x => x.setAttribute('aria-pressed', String(x.dataset.c === cat)));
    [...$('catSheetList').children].forEach(x => x.classList.toggle('active', x.dataset.c === cat));
    render();
  };

  $('cats').onclick = e => {
    const b = e.target.closest('button');
    if (b) applyCat(b.dataset.c);
  };
  $('catSheetList').onclick = e => {
    const b = e.target.closest('button');
    if (b) { applyCat(b.dataset.c); $('catSheet').classList.remove('on'); }
  };
}

function render(){
  if (!store) return;
  const t = norm(term);
  let items = store.products.filter(p =>
    (!cat || p.c === cat) &&
    (!t || norm(p.n).includes(t) || norm(p.c || '').includes(t) || norm(p.u || '').includes(t)) &&
    (!onlyStock || p.s !== 0)
  );

  if (sortBy === 'price_asc') items.sort((a, b) => (Number(a.p) || 0) - (Number(b.p) || 0));
  else if (sortBy === 'price_desc') items.sort((a, b) => (Number(b.p) || 0) - (Number(a.p) || 0));
  else if (sortBy === 'name_asc') items.sort((a, b) => String(a.n || '').localeCompare(String(b.n || ''), 'ar'));

  $('countLabel').textContent = (cat ? cat + ' (' + items.length + ')' : 'المنتجات المتاحة (' + items.length + ')');
  $('state').style.display = items.length ? 'none' : 'block';
  if (!items.length) $('state').textContent = 'لا توجد منتجات مطابقة.';

  $('list').innerHTML = items.map(p => {
    const q = cart[p.id] || 0;
    const out = p.s === 0;
    const cached = imgCache[p.id];
    const validImg = typeof cached === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(cached);

    return `<article class="item">
      <div class="ph" data-img="${esc(p.id)}" data-qv="${esc(p.id)}">
        ${p.c ? `<span class="badge-cat">${esc(p.c)}</span>` : ''}
        ${validImg ? `<img src="${cached}" alt="${esc(p.n)}">` : (p.i ? '<span class="skel" style="width:100%;height:100%"></span>' : '🛍️')}
      </div>
      <div class="info">
        <b data-qv="${esc(p.id)}">${esc(p.n)}</b>
        ${p.u ? `<small>${esc(p.u)}</small>` : ''}
        <div class="price-row">
          <div class="price">${esc(money(p.p))}</div>
          ${out ? '<div class="out">غير متوفر</div>' : ''}
        </div>
        ${q ? `<div class="qty"><button type="button" data-dec="${esc(p.id)}" aria-label="إنقاص">−</button><span>${q}</span><button type="button" data-inc="${esc(p.id)}" aria-label="زيادة">＋</button></div>` : `<button type="button" class="add" data-inc="${esc(p.id)}" ${out ? 'disabled' : ''}>أضف للسلة</button>`}
      </div>
    </article>`;
  }).join('');
  lazyImages();
}

const imgCache = {};
let io = null;
function lazyImages(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    loadImg(e.target);
  }), {rootMargin: '200px'});
  document.querySelectorAll('.ph[data-img]').forEach(el => {
    const id = el.dataset.img;
    if (id in imgCache) return;
    const p = store.products.find(x => String(x.id) === id);
    if (p && p.i) io.observe(el);
  });
}

async function loadImg(el){
  const id = el.dataset.img;
  try {
    if (!(id in imgCache)) {
      const r = await fetch(DB + '/stores_img/' + encodeURIComponent(code) + '/' + encodeURIComponent(id) + '.json');
      imgCache[id] = await r.json();
    }
    const src = imgCache[id];
    const badge = el.querySelector('.badge-cat');
    if (typeof src === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(src)) {
      el.innerHTML = '';
      if (badge) el.appendChild(badge);
      const im = new Image();
      im.alt = '';
      im.src = src;
      el.appendChild(im);
    } else {
      el.innerHTML = (badge ? badge.outerHTML : '') + '🛍️';
    }
  } catch(_) {
    el.textContent = '🛍️';
  }
}

function openQuickView(id){
  const p = store.products.find(x => String(x.id) === String(id));
  if (!p) return;
  const q = cart[p.id] || 0;
  const out = p.s === 0;
  const src = imgCache[p.id];
  const hasImg = typeof src === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(src);

  $('qvPanel').innerHTML = `
    <div class="sheet-handle"></div>
    <div class="panel-head">
      <h2>معاينة المنتج</h2>
      <button type="button" class="close-ico" id="closeQvBtn">✕</button>
    </div>
    <div class="qv-box">${hasImg ? `<img src="${src}" alt="${esc(p.n)}">` : '🛍️'}</div>
    <h3 style="margin:4px 0 6px;font-size:18px">${esc(p.n)}</h3>
    ${p.u ? `<p style="color:var(--muted);margin:0 0 10px;font-size:14px">${esc(p.u)}</p>` : ''}
    <div class="total" style="margin:10px 0">
      <span>السعر</span>
      <span style="color:var(--success)">${esc(money(p.p))}</span>
    </div>
    ${q ? `<div class="qty"><button type="button" data-dec="${esc(p.id)}">−</button><span>${q}</span><button type="button" data-inc="${esc(p.id)}">＋</button></div>` : `<button type="button" class="add" style="width:100%;padding:13px" data-inc="${esc(p.id)}" ${out ? 'disabled' : ''}>${out ? 'غير متوفر حالياً' : 'أضف إلى الحقيبة'}</button>`}
  `;
  $('qvSheet').classList.add('on');
  $('closeQvBtn').onclick = () => $('qvSheet').classList.remove('on');
}

document.addEventListener('click', e => {
  const inc = e.target.closest('[data-inc]');
  const dec = e.target.closest('[data-dec]');
  const qv = e.target.closest('[data-qv]');

  if (inc) {
    const id = inc.dataset.inc;
    cart[id] = (cart[id] || 0) + 1;
    saveCart();
    render();
    renderCartBar();
    renderLines();
    if ($('qvSheet').classList.contains('on')) openQuickView(id);
    return;
  }
  if (dec) {
    const id = dec.dataset.dec;
    cart[id] = Math.max(0, (cart[id] || 0) - 1);
    if (!cart[id]) delete cart[id];
    saveCart();
    render();
    renderCartBar();
    renderLines();
    if ($('qvSheet').classList.contains('on')) openQuickView(id);
    return;
  }
  if (qv && !e.target.closest('button')) {
    openQuickView(qv.dataset.qv);
  }
});

function cartItems(){
  return Object.entries(cart)
    .map(([id, q]) => ({p: store.products.find(x => String(x.id) === id), q}))
    .filter(x => x.p && x.q > 0);
}

function renderCartBar(){
  if (!store) return;
  const it = cartItems();
  const n = it.reduce((a, x) => a + x.q, 0);
  const badge = $('cartBadge');
  badge.style.display = n ? 'inline-flex' : 'none';
  badge.textContent = n;
  $('navCartLabel').textContent = n ? money(it.reduce((a, x) => a + x.q * x.p.p, 0)) : 'الحقيبة';
}

function renderLines(){
  if (!store) return;
  const it = cartItems();
  $('lines').innerHTML = it.map(x => `
    <div class="line">
      <div class="line-meta">
        <b>${esc(x.p.n)}</b>
        <small>${esc(money(x.p.p))} × ${x.q} = ${esc(money(x.q * x.p.p))}</small>
      </div>
      <div class="line-qty">
        <button type="button" data-dec="${esc(x.p.id)}">−</button>
        <span>${x.q}</span>
        <button type="button" data-inc="${esc(x.p.id)}">＋</button>
      </div>
    </div>
  `).join('') || '<div class="msg" style="padding:20px;margin:0">الحقيبة فارغة</div>';
  $('sum').textContent = money(it.reduce((a, x) => a + x.q * x.p.p, 0));
}

// Bottom Navigation Events
const setActiveTab = btn => {
  ['navHome','navCats','navSearch','openCart'].forEach(id => $(id).classList.toggle('active', $(id) === btn));
};

$('navHome').onclick = () => {
  setActiveTab($('navHome'));
  cat = '';
  term = '';
  $('q').value = '';
  [...$('cats').children].forEach((x, i) => x.setAttribute('aria-pressed', String(i === 0)));
  window.scrollTo({top: 0, behavior: 'smooth'});
  render();
};

$('navCats').onclick = () => {
  setActiveTab($('navCats'));
  $('catSheet').classList.add('on');
};
$('closeCatSheet').onclick = () => $('catSheet').classList.remove('on');
$('catSheet').onclick = e => { if (e.target === $('catSheet')) $('catSheet').classList.remove('on'); };

$('navSearch').onclick = () => {
  setActiveTab($('navSearch'));
  window.scrollTo({top: 0, behavior: 'smooth'});
  $('q').focus();
};

$('openCart').onclick = () => {
  setActiveTab($('openCart'));
  renderLines();
  try {
    const c = JSON.parse(localStorage.getItem('khz_customer') || '{}');
    ['cName','cPhone','cAddr'].forEach(k => { if (c[k] && !$(k).value) $(k).value = c[k]; });
  } catch(_) {}
  $('sheet').classList.add('on');
};

const closeBag = () => {
  $('sheet').classList.remove('on');
  setActiveTab($('navHome'));
};
$('closeCart').onclick = closeBag;
$('continueBtn').onclick = closeBag;
$('sheet').onclick = e => { if (e.target === $('sheet')) closeBag(); };
$('qvSheet').onclick = e => { if (e.target === $('qvSheet')) $('qvSheet').classList.remove('on'); };

$('q').oninput = e => { term = e.target.value; render(); };
$('sortSelect').onchange = e => { sortBy = e.target.value; render(); };
$('onlyStock').onchange = e => { onlyStock = e.target.checked; render(); };

$('send').onclick = () => {
  const it = cartItems();
  if (!it.length) return;
  const name = $('cName').value.trim(), phone = $('cPhone').value.trim(), addr = $('cAddr').value.trim();
  if (!name || !phone) { alert('اكتب اسمك ورقم هاتفك حتى يتواصل معك المحل.'); return; }
  try { localStorage.setItem('khz_customer', JSON.stringify({cName: name, cPhone: phone, cAddr: addr})); } catch(_) {}
  const lines = it.map(x => '• ' + x.p.n + ' × ' + x.q + ' = ' + money(x.q * x.p.p));
  const text = '🛒 طلب جديد من متجر ' + store.shopName + '\n\n' + lines.join('\n') + '\n\nالمجموع: ' + money(it.reduce((a, x) => a + x.q * x.p.p, 0)) + '\n\n👤 ' + name + '\n📞 ' + phone + (addr ? '\n📍 ' + addr : '') + ($('cNote').value.trim() ? '\n📝 ' + $('cNote').value.trim() : '');
  const wa = String(store.whatsapp || '').replace(/\D/g,'').replace(/^00/,'');
  window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(text), '_blank');
};

load();
})();
</script>
</body>
</html>
